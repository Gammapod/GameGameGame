name: Feedback Build

on:
  workflow_dispatch:
  push:
    tags:
      - "feedback-*"

jobs:
  windows-console:
    name: Windows Console Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test core/content/console
        run: dotnet test tests/GameGameGame.Tests/GameGameGame.Tests.csproj -c Release

      - name: Publish self-contained console
        run: dotnet publish src/GameGameGame.Console/GameGameGame.Console.csproj -c Release -r win-x64 --self-contained true -o artifacts/GameGameGame-win-x64

      - name: Smoke test packaged scenario catalog
        shell: pwsh
        working-directory: artifacts/GameGameGame-win-x64
        run: |
          ./GameGameGame.exe scan-scenarios Content/Beta --output Content/Beta/Manifest-smoke.yaml
          Remove-Item Content/Beta/Manifest-smoke.yaml

      - name: Add feedback README
        shell: pwsh
        run: |
          @'
          GameGameGame Feedback Build

          Run GameGameGame.exe to open the interactive scenario list.

          Controls:
          - Up/Down selects a scenario.
          - Enter launches the selected scenario.
          - Arrow keys move in a scenario.
          - I inspects, P picks up, D drops.
          - Q or Esc returns to the scenario list or quits.

          Scenario YAML files are included under Content/Beta for inspection.
          '@ | Set-Content -Path artifacts/GameGameGame-win-x64/README.txt

      - name: Zip feedback build
        shell: pwsh
        run: Compress-Archive -Path artifacts/GameGameGame-win-x64/* -DestinationPath artifacts/GameGameGame-win-x64.zip -Force

      - name: Upload feedback build
        uses: actions/upload-artifact@v4
        with:
          name: GameGameGame-win-x64
          path: artifacts/GameGameGame-win-x64.zip
