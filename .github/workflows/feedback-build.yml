name: Feedback Build

on:
  workflow_dispatch:

jobs:
  feedback-build:
    name: Build curated desktop feedback package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GameGameGame.sln

      - name: Test
        run: dotnet test GameGameGame.sln --configuration Release --no-restore

      - name: Package feedback build
        shell: pwsh
        run: ./tools/package-feedback-build.ps1 -Configuration Release -Runtime win-x64

      - name: Upload feedback build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameGameGame-feedback-win-x64
          path: artifacts/feedback-build/GameGameGame-feedback-win-x64.zip
          if-no-files-found: error
