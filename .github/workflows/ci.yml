name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300

      - name: Restore
        run: dotnet restore GameGameGame.sln

      - name: Build
        run: dotnet build GameGameGame.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GameGameGame.sln --configuration Release --no-build --verbosity normal
