entityTemplates:
  debugPlayer:
    name: Debug Player
    inventoryWidth: 2
    inventoryHeight: 2
    bulk: 5
    aperture: 10
    defaultActionPlanId: debugPlayerActionPlan
    actionStateDefaults:
      facing: North

presentations:
  debugPlayer:
    presentationId: actor.player
    paletteId: actor.player.default
    glyph: '@'
    color: Yellow

actionPlans:
  debugPlayerActionPlan:
    id: debugPlayerActionPlan
    behavior:
      steps:
      - kind: Move
        directionMode: Forward
      - kind: Push
        directionMode: Forward
      - kind: TransformAdjacentToInventory
      - kind: TransformInventoryToAdjacent
      - kind: Transfer
        targetSlot: 1
        directionMode: Forward
        transferDirection: ActorToTarget
      - kind: Transfer
        targetSlot: 1
        directionMode: Forward
        transferDirection: TargetToActor
      - kind: EnterTarget
      - kind: ExitFacing
