    - owner: debugLoopNodeEast
      origin: { x: 14, y: 2 }
    - owner: debugLoopHallNorth
      origin: { x: 15, y: -3 }
    - owner: debugLoopNodeNorth
      origin: { x: 14, y: -6 }
    - owner: debugLoopHallWest
      origin: { x: 9, y: -5 }
    - owner: debugLoopNodeWest
