    - from: { owner: debugLoopNodeNorth, edge: West }
      to: { owner: debugLoopHallWest, edge: East }
      align: Center
    - from: { owner: debugLoopHallWest, edge: West }
      to: { owner: debugLoopNodeWest, edge: East }
      align: Center
    - from: { owner: debugLoopNodeWest, edge: South }
      to: { owner: debugLoopHallSouthUpper, edge: North }
      align: Center
    - from: { owner: debugLoopHallSouthUpper, edge: South }
      to: { owner: debugLoopNodeWestCenter, edge: North }
      align: Center
    - from: { owner: debugLoopNodeWestCenter, edge: South }
      to: { owner: debugLoopHallSouthLower, edge: North }
      align: Center
    - from: { owner: debugLoopHallSouthLower, edge: South }
      to: { owner: debugLoopNodeSouthWest, edge: North }
      align: Center
    - from: { owner: debugLoopNodeSouthWest, edge: East }
      to: { owner: debugLoopHallEastSouth, edge: West }
      align: Center
    - from: { owner: debugLoopHallEastSouth, edge: East }
      to: { owner: debugLoopNodeSouthEast, edge: West }
      align: Center
    - from: { owner: debugLoopNodeSouthEast, edge: North }
      to: { owner: debugLoopHallNorthReturn, edge: South }
      align: Center
    - from: { owner: debugLoopHallNorthReturn, edge: North }
      to: { owner: debugLoopNodeEast, edge: South }
      align: Center
