actionPlans:
  glowcapFungusProducesSpores:
    id: glowcapFungusProducesSpores
    behavior:
      steps:
      - kind: CreateEntity
        targetSelf: false
        templateId: glowcapSpore
        createPlacement: AdjacentOpen
  grubEatReproduceSeek:
    id: grubEatReproduceSeek
    behavior:
      steps:
      - kind: CreateEntity
        targetSelf: false
        templateId: glowcapGrub
        createPlacement: AdjacentOpen
        costs:
        - templateId: glowcapSpore
          quantity: 2
      - kind: PickupTarget
        targetLabel: food
        targetSelf: false
      - kind: TargetPathMove
        targetLabel: food
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: Move
        targetSelf: false
        directionMode: Forward
    steps: []
  batRegulateGrubs:
    id: batRegulateGrubs
    behavior:
      steps:
      - kind: PickupTarget
        targetLabel: prey
        targetSelf: false
      - kind: CreateEntity
        targetSelf: false
        templateId: glowcapGuano
        createPlacement: AdjacentOpen
        costs:
        - templateId: glowcapGrub
          quantity: 1
      - kind: TargetPathMove
        targetLabel: prey
        targetSelf: false
        pathMode: SeekAdjacency
    steps: []
  crystalEmitsMana:
    id: crystalEmitsMana
    behavior:
      steps:
      - kind: CreateEntity
        targetSelf: false
        templateId: manaSpark
        createPlacement: AdjacentOpen
  constructRechargeThenDefend:
    id: constructRechargeThenDefend
    behavior:
      steps:
      - kind: PickupTarget
        targetLabel: charge
        targetSelf: false
      - kind: DestroyTarget
        targetLabel: threat
        targetSelf: false
        costs:
        - templateId: manaSpark
          quantity: 1
      - kind: TargetPathMove
        targetLabel: threat
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: TargetPathMove
        targetLabel: charge
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: Move
        targetSelf: false
        directionMode: Forward
  leechDrainSplitSeek:
    id: leechDrainSplitSeek
    behavior:
      steps:
      - kind: PickupTarget
        targetLabel: mana
        targetSelf: false
      - kind: CreateEntity
        targetSelf: false
        templateId: manaLeech
        createPlacement: AdjacentOpen
        costs:
        - templateId: manaSpark
          quantity: 1
      - kind: TargetPathMove
        targetLabel: mana
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: Move
        targetSelf: false
        directionMode: Forward
  fountainSpillsCoin:
    id: fountainSpillsCoin
    behavior:
      steps:
      - kind: CreateEntity
        targetSelf: false
        templateId: bazaarCoin
        createPlacement: AdjacentOpen
  goblinBuyThenGather:
    id: goblinBuyThenGather
    behavior:
      steps:
      - kind: CreateEntity
        targetSelf: false
        templateId: hiredBruiser
        createPlacement: AdjacentOpen
        costs:
        - templateId: bazaarCoin
          quantity: 1
      - kind: PickupTarget
        targetLabel: coin
        targetSelf: false
      - kind: TargetPathMove
        targetLabel: coin
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: TargetPathMove
        targetLabel: thief
        targetSelf: false
        pathMode: FleeAdjacency
      - kind: Move
        targetSelf: false
        directionMode: Forward
  thiefStealThenGather:
    id: thiefStealThenGather
    behavior:
      steps:
      - kind: TakeTarget
        targetLabel: victim
        targetSelf: false
      - kind: PickupTarget
        targetLabel: coin
        targetSelf: false
      - kind: TargetPathMove
        targetLabel: victim
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: TargetPathMove
        targetLabel: coin
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: Move
        targetSelf: false
        directionMode: Forward
  bruiserPursuesThieves:
    id: bruiserPursuesThieves
    behavior:
      steps:
      - kind: DestroyTarget
        targetLabel: thief
        targetSelf: false
      - kind: TargetPathMove
        targetLabel: thief
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: Move
        targetSelf: false
        directionMode: Forward
  observerPlan:
    id: observerPlan
    behavior:
      steps:
      - kind: Move
        targetSelf: false
        directionMode: Forward
      - kind: PickupTarget
        targetSelf: false
      - kind: DropFacing
        targetSelf: false
      - kind: Transfer
        targetSelf: false
        directionMode: Forward
        transferDirection: TargetToActor
    steps: []
  spiderPodCreatesCircuitSpider:
    id: spiderPodCreatesCircuitSpider
    behavior:
      steps:
      - kind: CreateEntity
        targetSelf: false
        templateId: circuitSpider
        createPlacement: AdjacentOpen
        costs:
        - templateId: spiderScrap
          quantity: 3
  circuitSpiderGatherGiveOrbit:
    id: circuitSpiderGatherGiveOrbit
    behavior:
      steps:
      - kind: GiveTarget
        targetLabel: pod
        targetSelf: false
      - kind: PickupTarget
        targetLabel: scrap
        targetSelf: false
      - kind: TargetPathMove
        targetLabel: scrap
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: TargetPathMove
        targetLabel: pod
        targetSelf: false
        pathMode: Orbit
        desiredDistance: 1
        orbitDirection: Clockwise
  spiderExperimenterPlan:
    id: spiderExperimenterPlan
    behavior:
      steps:
      - kind: Move
        targetSelf: false
        directionMode: Forward
      - kind: PickupTarget
        targetSelf: false
      - kind: DropFacing
        targetSelf: false
      - kind: Transfer
        targetSelf: false
        directionMode: Forward
        transferDirection: TargetToActor
    steps: []
