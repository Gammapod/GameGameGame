presentations:
  ratBarnScenarioRoot:
    glyph: '#'
    color: Gray
  ratBarnRoom:
    glyph: '#'
    color: Gray
  ratBarnRatCatcher:
    presentationId: actor.player
    paletteId: actor.player.default
    glyph: C
    color: Green
  ratBarnNorthFacingRat:
    presentationId: creature.rat
    paletteId: creature.rat.default
    glyph: r
    color: Earth
  ratBarnWestFacingRat:
    presentationId: creature.rat
    paletteId: creature.rat.default
    glyph: r
    color: Earth
  ratBarnCrate:
    presentationId: item.box
    paletteId: item.box.default
    glyph: X
    color: Earth
  ratBarnCrystal:
    presentationId: item.crystal
    paletteId: item.crystal.default
    glyph: '*'
    color: Cyan
  ratBarnBag:
    presentationId: item.bag
    paletteId: item.bag.default
    glyph: b
    color: Earth
  ratBarnCoin:
    presentationId: item.coin
    paletteId: item.coin.default
    glyph: $
    color: Yellow
  ratBarnBroom:
    glyph: /
    color: Earth
  ratBarnBucket:
    glyph: u
    color: Gray
actionPlans:
  ratCatcherCatchRatsThenEnterCrate:
    id: ratCatcherCatchRatsThenEnterCrate
    behavior:
      steps:
      - kind: TargetPathMove
        targetLabel: north
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: PickupTarget
        targetLabel: north
        targetSelf: false
      - kind: TargetPathMove
        targetLabel: west
        targetSelf: false
        pathMode: SeekAdjacency
      - kind: PickupTarget
        targetLabel: west
        targetSelf: false
      - kind: SeekTarget
        targetLabel: crate
        targetSelf: false
      - kind: EnterTarget
        targetLabel: crate
        targetSelf: false
      - kind: DropFacing
        targetSelf: false
    steps: []
  ratBarnRatMoveThenBackstep:
    id: ratBarnRatMoveThenBackstep
    behavior:
      steps:
      - kind: MoveFacing
        targetSelf: false
      - kind: Backstep
        targetSelf: false
scenarios:
  user-ratbarn-ratcatcher:
    name: RatBarn RatCatcher
    scenarioRootEntityTemplateId: ratBarnScenarioRoot
