      templateId: canonicalPickupSuccessActor
      coord:
        x: 1
        y: 1
    - entityId: pickupSuccessGem
      templateId: canonicalPickupSuccessGem
      coord:
        x: 2
        y: 1
    - entityId: pickupFailureActor
      templateId: canonicalPickupFailureActor
      coord:
        x: 1
        y: 3
    - entityId: pickupFailureBoulder
      templateId: canonicalPickupFailureBoulder
      coord:
        x: 2
        y: 3
    - entityId: dropSuccessActor
      templateId: canonicalDropSuccessActor
      coord:
        x: 5
        y: 1
    - entityId: dropFailureActor
      templateId: canonicalDropFailureActor
      coord:
        x: 5
        y: 3
    - entityId: dropFailureBlocker
