      coord:
        x: 5
        y: 3
  canonicalPickupDropObserver:
    name: Canonical Pickup Drop Observer
    inventoryWidth: 1
    inventoryHeight: 1
    weight: 0
    carryingCapacity: 0
    bulk: 1
    aperture: 1
    actionStateDefaults:
      facing: West
  canonicalPickupSuccessActor:
    name: Pickup Success Actor
    inventoryWidth: 1
    inventoryHeight: 1
    weight: 1
    carryingCapacity: 10
    bulk: 1
    aperture: 10
    defaultActionPlanId: canonicalPickupTargetPlan
    targetingRules:
    - slot: 1
      label: target
      targetTemplateId: canonicalPickupSuccessGem
      targetCapabilities:
      - PickupTarget
      range: 1
  canonicalPickupFailureActor:
