entityTemplates:
  canonicalTransferOutcomeRoom:
    name: Canonical Transfer Outcome Room
    inventoryWidth: 16
    inventoryHeight: 12
    weight: 1000
    carryingCapacity: 1000
    bulk: 1000
    aperture: 1000
    carriedEntities:
    - entityId: transferGiveSuccessActor
      templateId: transferGiveSuccessActorTemplate
      coord: { x: 1, y: 1 }
    - entityId: transferGiveSuccessChest
      templateId: transferOpenChest
      coord: { x: 2, y: 1 }
    - entityId: transferTakeSuccessActor
      templateId: transferTakeSuccessActorTemplate
      coord: { x: 5, y: 1 }
    - entityId: transferTakeSuccessChest
      templateId: transferTakeSuccessChestTemplate
      coord: { x: 6, y: 1 }
    - entityId: transferMissingTargetActor
      templateId: transferMissingTargetActorTemplate
      coord: { x: 9, y: 1 }
    - entityId: transferMissingTargetChest
      templateId: transferOpenChest
      coord: { x: 10, y: 1 }
    - entityId: transferNoCounterpartyActor
      templateId: transferNoCounterpartyActorTemplate
      coord: { x: 13, y: 1 }
    - entityId: transferNoInventoryActor
      templateId: transferNoInventoryActorTemplate
      coord: { x: 1, y: 4 }
    - entityId: transferNoInventoryRock
      templateId: transferRockNoInventory
      coord: { x: 2, y: 4 }
    - entityId: transferNotInActorActor
      templateId: transferNotInActorActorTemplate
      coord: { x: 5, y: 4 }
    - entityId: transferNotInActorChest
      templateId: transferNotInActorChestTemplate
      coord: { x: 6, y: 4 }
    - entityId: transferDestinationFullActor
      templateId: transferDestinationFullActorTemplate
      coord: { x: 9, y: 4 }
    - entityId: transferFullChest
      templateId: transferFullChestTemplate
      coord: { x: 10, y: 4 }
    - entityId: transferDestinationApertureActor
      templateId: transferDestinationApertureActorTemplate
      coord: { x: 13, y: 4 }
    - entityId: transferNarrowDestinationChest
      templateId: transferNarrowChest
      coord: { x: 14, y: 4 }
    - entityId: transferSourceApertureActor
      templateId: transferSourceApertureActorTemplate
      coord: { x: 1, y: 7 }
    - entityId: transferSourceApertureChest
      templateId: transferOpenChest
      coord: { x: 2, y: 7 }
    - entityId: transferTakeNotInSourceActor
      templateId: transferTakeNotInSourceActorTemplate
      coord: { x: 5, y: 7 }
    - entityId: transferTakeNotInSourceChest
      templateId: transferOpenChest
      coord: { x: 6, y: 7 }
    - entityId: transferActorFullActor
      templateId: transferActorFullActorTemplate
      coord: { x: 9, y: 7 }
    - entityId: transferActorFullChest
      templateId: transferActorFullChestTemplate
      coord: { x: 10, y: 7 }
    - entityId: transferExitPolicyActor
      templateId: transferExitPolicyActorTemplate
      coord: { x: 0, y: 0 }
    - entityId: transferExitPolicyChest
      templateId: transferExitPolicyChestTemplate
      coord: { x: 1, y: 0 }
  canonicalTransferInteractionRoom:
    name: Canonical Transfer Player Interaction Room
    inventoryWidth: 9
    inventoryHeight: 7
    weight: 1000
    carryingCapacity: 1000
    bulk: 1000
    aperture: 1000
    carriedEntities:
    - entityId: playerTransferChest
      templateId: playerTransferChestTemplate
      coord: { x: 5, y: 3 }

  canonicalTransferObserver:
    name: Canonical Transfer Observer
    inventoryWidth: 1
    inventoryHeight: 1
    weight: 0
    carryingCapacity: 0
    bulk: 1
    aperture: 1
    actionStateDefaults:
      facing: West
  transferGiveSuccessActorTemplate:
    name: Transfer Give Success Actor
    inventoryWidth: 1
    inventoryHeight: 1
    weight: 1
    carryingCapacity: 20
    bulk: 1
    aperture: 10
    defaultActionPlanId: transferGiveForwardPlan
    actionStateDefaults: { facing: East, target: giveSuccessGem }
    carriedEntities:
    - entityId: giveSuccessGem
      templateId: transferGem
      coord: { x: 0, y: 0 }
  transferTakeSuccessActorTemplate:
    name: Transfer Take Success Actor
    inventoryWidth: 1
    inventoryHeight: 1
    weight: 1
    carryingCapacity: 20
    bulk: 1
    aperture: 10
