actionPlans:
  transferGiveForwardPlan:
    id: transferGiveForwardPlan
    behavior:
      steps:
      - kind: Transfer
        targetSlot: 1
        directionMode: Forward
        transferDirection: ActorToTarget
  transferTakeForwardPlan:
    id: transferTakeForwardPlan
    behavior:
      steps:
      - kind: Transfer
        targetSlot: 1
        directionMode: Forward
        transferDirection: TargetToActor
  transferPlayerGiveTakePlan:
    id: transferPlayerGiveTakePlan
    behavior:
      steps:
      - kind: Transfer
        targetSlot: 1
        directionMode: Forward
        transferDirection: ActorToTarget
      - kind: Transfer
        targetSlot: 1
        directionMode: Forward
        transferDirection: TargetToActor
scenarios:
  beta-canonical-transfer-outcomes:
    name: Beta Canonical Transfer Outcomes
    scenarioRootEntityTemplateId: canonicalTransferOutcomeRoom
    playerEntityTemplateId: canonicalTransferObserver
    playerEntityId: canonicalTransferOutcomeObserver
    playerStart: { x: 15, y: 11 }
    playerControls:
      player-1:
      - canonicalTransferOutcomeObserver
  beta-canonical-transfer-player-interaction:
    name: Beta Canonical Transfer Player Interaction
    scenarioRootEntityTemplateId: canonicalTransferInteractionRoom
    playerEntityTemplateId: canonicalTransferPlayer
    playerEntityId: canonicalTransferPlayer
    playerStart: { x: 4, y: 3 }
    playerControls:
      player-1:
      - canonicalTransferPlayer
