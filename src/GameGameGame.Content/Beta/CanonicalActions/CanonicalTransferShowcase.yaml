  transferTakeSuccessActorTemplate: { glyph: 't', color: Green }
  transferMissingTargetActorTemplate: { glyph: 'm', color: Earth }
  transferNoCounterpartyActorTemplate: { glyph: 'n', color: Earth }
  transferNoInventoryActorTemplate: { glyph: 'i', color: Earth }
  transferNotInActorActorTemplate: { glyph: 'a', color: Earth }
  transferDestinationFullActorTemplate: { glyph: 'f', color: Earth }
  transferDestinationApertureActorTemplate: { glyph: 'd', color: Earth }
  transferSourceApertureActorTemplate: { glyph: 's', color: Earth }
  transferTakeNotInSourceActorTemplate: { glyph: 'o', color: Earth }
  transferActorFullActorTemplate: { glyph: 'u', color: Earth }
