actionPlans:
  Player_Debug_Action_Plan:
    id: Player_Debug_Action_Plan
    behavior:
      steps:
      - kind: Move
        directionMode: Forward
      - kind: TransformAdjacentToInventory
        targetSlot: 1
      - kind: TransformInventoryToAdjacent
      - kind: EnterTarget
        targetSlot: 1
      - kind: ExitFacing
      - kind: Push
        targetSlot: 1
        directionMode: Forward
      - kind: Transfer
        targetSlot: 1
        directionMode: Forward
        transferDirection: ActorToTarget

