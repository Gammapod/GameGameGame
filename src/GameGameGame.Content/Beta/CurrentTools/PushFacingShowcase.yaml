      templateId: betaPusherSuccess
      coord:
        x: 1
        y: 1
    - entityId: successBlock
      templateId: betaSuccessBlock
      coord:
        x: 2
        y: 1
    - entityId: blockedPusher
      templateId: betaPusherBlocked
      coord:
        x: 1
        y: 3
    - entityId: blockedFrontBlock
      templateId: betaBlockedFrontBlock
      coord:
