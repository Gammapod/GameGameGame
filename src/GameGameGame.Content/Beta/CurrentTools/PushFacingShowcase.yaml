    inventoryWidth: 0
    inventoryHeight: 0
    weight: 5
    carryingCapacity: 0
  betaBlockedRearBlock:
    name: Rear Block
    inventoryWidth: 0
    inventoryHeight: 0
    weight: 5
    carryingCapacity: 0
