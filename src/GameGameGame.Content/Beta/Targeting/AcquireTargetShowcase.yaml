entityTemplates:
  betaAcquireTargetRoom:
    name: Beta Acquire Target Showcase Room
    inventoryWidth: 10
    inventoryHeight: 6
    weight: 1000
    carryingCapacity: 1000
    carriedEntities:
    - entityId: targetAcquirer
      templateId: betaTargetAcquirer
      coord:
        x: 4
        y: 2
    - entityId: westTieTarget
      templateId: betaTargetBeacon
      coord:
        x: 3
        y: 1
    - entityId: eastTieTarget
