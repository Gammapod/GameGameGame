entityTemplates:
  slimeLovesPlayerRoom:
    name: Slime Loves Player Room
    inventoryWidth: 8
    inventoryHeight: 5
    weight: 0
    carryingCapacity: 0
    bulk: 1000
    aperture: 1000
    carriedEntities:
    - entityId: slime
      templateId: lovingSlime
      coord:
        x: 0
        y: 0
  slimeLovesPlayer:
    name: Slime Loves Player
    inventoryWidth: 1
    inventoryHeight: 1
    weight: 0
    carryingCapacity: 0
    bulk: 1
    aperture: 2
    defaultActionPlanId: slimeLovesPlayerBehavior
    actionStateDefaults:
      facing: West
  lovingSlime:
    name: Loving Slime
    inventoryWidth: 1
    inventoryHeight: 1
    weight: 0
    carryingCapacity: 0
