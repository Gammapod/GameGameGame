entityTemplates:
  game:
    name: Game
    inventoryWidth: 8
    inventoryHeight: 5
    weight: 0
    carryingCapacity: 0
    carriedEntities:
    - entityId: gameRock2
      templateId: rock
      coord:
        x: 4
        y: 3
    - entityId: gameRock3
      templateId: rock
      coord:
        x: 4
        y: 2
  player:
    name: Player
    inventoryWidth: 3
    inventoryHeight: 2
    weight: 10
    carryingCapacity: 5
    carriedEntities:
    - entityId: playerSword
      templateId: sword
      coord:
        x: 1
        y: 0
  slime:
    name: Slime
    inventoryWidth: 1
    inventoryHeight: 1
    weight: 3
    carryingCapacity: 20
    defaultActionPlanId: wandering
    defaultPlanVariables:
      facing:
        kind: Direction
        directionValue: West
    carriedEntities:
    - entityId: slimeSword
      templateId: sword
      coord:
        x: 0
        y: 0
  giantSlime:
    name: Giant Slime
    inventoryWidth: 4
    inventoryHeight: 3
    weight: 15
    carryingCapacity: 20
    defaultActionPlanId: wandering
    defaultPlanVariables:
      facing:
        kind: Direction
        directionValue: West
    carriedEntities:
    - entityId: giantSlimeRock
      templateId: rock
      coord:
        x: 2
        y: 1
  rock:
    name: Rock
    inventoryWidth: 0
    inventoryHeight: 0
    weight: 3
    carryingCapacity: 3
  sword:
    name: Sword
    inventoryWidth: 1
    inventoryHeight: 1
    weight: 3
    carryingCapacity: 0
presentations:
  game:
    glyph: G
    color: Yellow
  player:
    glyph: '@'
    color: Cyan
  slime:
    glyph: s
    color: Green
  giantSlime:
    glyph: h
    color: Earth
  rock:
    glyph: '*'
    color: Earth
  sword:
    glyph: t
    color: Gray
actionPlans:
  wandering:
    id: wandering
    steps:
    - label: move facing
      checks:
      - kind: CanMove
        directionVariable: facing
      onSuccess:
        kind: Move
        directionVariable: facing
        consumesTurn: false
        continuePlan: false
    - label: handle blocker
      checks:
      - kind: BlockingEntity
        directionVariable: facing
        targetVariable: target
      onSuccess:
        kind: CallPlan
        planId: handleBlocker
        consumesTurn: false
        continuePlan: false
      onFailure:
        kind: ReverseDirection
        directionVariable: facing
        consumesTurn: false
        continuePlan: true
    - label: wait
      checks: []
      onSuccess:
        kind: Wait
        consumesTurn: false
        continuePlan: false
  handleBlocker:
    id: handleBlocker
    steps:
    - label: pickup blocker
      checks:
      - kind: CanPickup
        targetVariable: target
        inventoryCoord:
          x: 0
          y: 0
      onSuccess:
        kind: Pickup
        targetVariable: target
        inventoryCoord:
          x: 0
          y: 0
        consumesTurn: false
        continuePlan: false
    - label: reverse after bump
      checks: []
      onSuccess:
        kind: ReverseDirection
        directionVariable: facing
        consumesTurn: true
        continuePlan: false
